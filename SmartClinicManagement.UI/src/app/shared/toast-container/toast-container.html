<div class="toast-stack">

  <div class="toast-item" *ngFor="let toast of (toasts$ | async)" [ngClass]="'toast-' + toast.type">

    <i class="bi" [ngClass]="iconFor(toast.type)"></i>

    <span class="toast-message">{{ toast.message }}</span>

    <button type="button" class="toast-close" (click)="dismiss(toast.id)">
      <i class="bi bi-x"></i>
    </button>

  </div>

</div>
