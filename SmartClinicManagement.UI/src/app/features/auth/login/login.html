<div class="auth-page">

  <div class="auth-hero">
    <div class="auth-hero-content">
      <i class="bi bi-hospital"></i>
      <h1>Smart Clinic Management System</h1>
      
    </div>
  </div>

  <div class="auth-panel">

    <div class="auth-card shadow-sm">

      <h2>Welcome Back</h2>
      <p class="auth-subtitle">Log in to your account</p>

      <form [formGroup]="loginForm"
            (ngSubmit)="onSubmit()">

        <div class="mb-3">

          <label class="form-label">
            Email
          </label>

          <input type="email"
                 class="form-control"
                 placeholder="Enter Email"
                 formControlName="email">
          <div class="text-danger mt-1"
               *ngIf="loginForm.get('email')?.touched &&
loginForm.get('email')?.invalid">

            Email is required.

          </div>

        </div>

        <div class="mb-3">

          <label class="form-label">
            Password
          </label>

          <input type="password"
                 class="form-control"
                 placeholder="Enter Password"
                 formControlName="password">
          <div class="text-danger mt-1"
               *ngIf="loginForm.get('password')?.touched &&
loginForm.get('password')?.invalid">

            Password is required.

          </div>

        </div>

        <div class="d-flex justify-content-between mb-3">

     <!---   <div class="form-check">

            <input class="remember-checkbox"
                   type="checkbox"
                   formControlName="rememberMe">

            <label class="form-check-label">
              Remember Me
            </label>

          </div> -->

          <a routerLink="/forgot-password">
            Forgot Password?
          </a>
          
        </div>

        <button class="btn btn-primary w-100"
                type="submit"
                [disabled]="loginForm.invalid || submitting">

          {{ submitting ? 'Logging in...' : 'Login' }}

        </button>

        

      </form>

    </div>

  </div>

</div>
