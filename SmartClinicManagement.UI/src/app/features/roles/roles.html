<div class="roles-page">

  <div class="page-header">

    <div>
      <h1>Roles</h1>
      <h3>Total Roles: {{ roles.length }}</h3>

      <p>
        Manage system roles
      </p>
    </div>

    <button class="btn btn-primary"
            (click)="openCreateForm()">

      <i class="bi bi-plus-lg"></i>

      Add Role

    </button>

  </div>


  <!-- FORM -->

  <div class="card form-card"
       *ngIf="showForm">

    <div class="card-header">

      <h3>
        {{ editingId ? 'Edit Role' : 'Create Role' }}
      </h3>

    </div>

    <div class="card-body">

      <form [formGroup]="roleForm"
            (ngSubmit)="saveRole()">

        <div class="mb-3">

          <label class="form-label">
            Role Name
          </label>

          <input type="text"
                 class="form-control"
                 formControlName="roleName"
                 placeholder="Enter role name">

          <div class="text-danger mt-1"
               *ngIf="
              roleForm.get('roleName')?.touched &&
              roleForm.get('roleName')?.invalid
            ">

            Role name is required.

          </div>

        </div>


        <div class="mb-3">

          <label class="form-label">
            Description
          </label>

          <textarea class="form-control"
                    rows="3"
                    formControlName="description"
                    placeholder="Enter description">
          </textarea>

        </div>


        <button type="submit"
                class="btn btn-primary me-2">

          {{ editingId ? 'Update' : 'Save' }}

        </button>

        <button type="button"
                class="btn btn-secondary"
                (click)="cancelForm()">

          Cancel

        </button>

      </form>

    </div>

  </div>


  <div class="card roles-card">

    <div class="card-header list-header">
      <h2>Role List</h2>
      <span>Total: {{ roles.length }}</span>
    </div>

    <!-- Loading -->

    <div *ngIf="loading" class="loading">
      <div class="spinner-border text-primary"></div>
      <span>Loading...</span>
    </div>

    <!-- Table -->

    <div *ngIf="!loading">

      <table class="table table-hover" *ngIf="roles.length > 0">

        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>

          <tr *ngFor="let role of roles; let i = index">

            <td>{{ i + 1 }}</td>

            <td>{{ role.roleName }}</td>

            <td>{{ role.description }}</td>

            <td>

              <button class="btn btn-primary btn-sm me-2"
                      (click)="editRole(role)">
                Edit
              </button>

              <button class="btn btn-danger btn-sm"
                      (click)="deleteRole(role.roleID)">
                Delete
              </button>

            </td>

          </tr>

        </tbody>

      </table>

      <div class="empty-state" *ngIf="roles.length===0">
        No Roles Found
      </div>

    </div>

  </div>
</div>
